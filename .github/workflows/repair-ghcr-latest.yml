name: Repair KMMS Canaille latest image tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag in the vX.Y.Z-kmms.N format
        required: true
        type: string

concurrency:
  group: publish-kmms-canaille-latest-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  repair-latest:
    name: Repoint latest to an existing immutable release image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Derive and validate the release image tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kmms\.[0-9]+$ ]]; then
            echo "Expected tag format vX.Y.Z-kmms.N, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_OUTPUT"

      - name: Require a commit reachable from main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --force origin main
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" origin/main

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the immutable release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker manifest inspect "$IMAGE" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.0.0

      - name: Repoint latest to the highest released version
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_release_tag="$(
            git tag --merged origin/main --list 'v*-kmms.*' \
              | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+-kmms\.[0-9]+' \
              | sort -V \
              | tail -n 1
          )"
          if [ "$RELEASE_TAG" != "$latest_release_tag" ]; then
            echo "Not updating latest from $RELEASE_TAG; $latest_release_tag is newer."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE%:*}:latest" "$IMAGE"
